<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adaptive Team Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <!-- Sección de encabezado (Equipo 1) -->
    <header class="container py-4">
      <div class="row align-items-center">
        <div class="col-md-4 text-center text-md-start">
          <h2 class="fw-bold">Quotes<br>Agua Viva C.C.</h2>
        </div>
        <div class="col-md-8 text-center text-md-end">
          <p class="fs-5 mb-0">¡Welcome to this website where you can find inspiration and hope!</p>
        </div>
      </div>
    </header>

    <!-- Sección de contenido principal (Equipo 2) -->
    <main class="container my-4">
      <!-- El contenido va aquí -->
       <div class="container">
            <div class="row">
                <div class="col-lg-6 col-lg-80">PAGINA WEB DE PRUEBA</div>
                <div class="col-lg-6 col-lg-30">¡¡BIENVENIDOS A NUESTRO SITIO WEB!!</div>
            </div>
        </div>
    </main>

    <!-- Sección de pie de página (Equipo 3) -->
    <footer class="container">
      <!-- El pie de página va aquí -->
        <div class="card">
            <div class="card-header">
                Cita bíblica del día
            </div>
            <div class="card-body">
                <figure>
                    <blockquote class="blockquote">
                        <p>La preparación crea puertas para el éxito.</p>
                    </blockquote>
                    <figcaption class="blockquote-footer">
                        Ps. Arturo Arias en <cite title="Source Title">Agua Viva - Lince</cite>
                    </figcaption>
                </figure>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" type="text/javascript"></script>
  </body>
</html>
